# Runs the route and saved-data tests (test/). Game data (data/) is not in the repository, so the checks that
# regenerate stockpiles from it are skipped here; run them locally after downloading the data.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
