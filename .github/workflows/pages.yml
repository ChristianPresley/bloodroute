# Deploys site/ to GitHub Pages. The icon bundle and map images (Stunlock artwork) are not committed, so they
# are downloaded here at build time with site/build-icons.js and site/build-map.js. The trimmed game data
# (site/gamedata.js) is committed, since gaming.tools can't be reached from CI.
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'calc/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download icons
        run: node site/build-icons.js
      - name: Download map
        run: node site/build-map.js
      - name: Test routes
        run: node --test
      - name: Package site
        run: |
          mkdir -p _site
          cp -r site/index.html site/assets site/js site/routes site/icons.js site/gamedata.js site/map _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
